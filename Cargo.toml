[workspace]
members = [
    "crates/frostlang",
    "crates/frostlang-parse",
    "crates/frostlang-runtime",
    "crates/frostlang-compile",
    "crates/frostlang-driver",
    "crates/frostlang-repl",
    "crates/frostlang-cli",
    "crates/frostlang-astviz",
]
resolver = "3"

# Each crate carries its own version, released independently.
[workspace.package]
edition = "2024"

# Workspace crates, for depending on one another. Each version is the minimum a
# dependent requires.
[workspace.dependencies]
frostlang-compile = { path = "crates/frostlang-compile", version = "0.0.1" }
frostlang-driver = { path = "crates/frostlang-driver", version = "0.0.1" }
frostlang-parse = { path = "crates/frostlang-parse", version = "0.0.1" }
frostlang-repl = { path = "crates/frostlang-repl", version = "0.0.1" }
frostlang-runtime = { path = "crates/frostlang-runtime", version = "0.0.1" }

# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unreachable_pub = "warn"   # a `pub` that no outside crate can reach: say what you mean
unused_lifetimes = "warn"

[workspace.lints.clippy]
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
explicit_into_iter_loop = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
unnested_or_patterns = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
flat_map_option = "warn"
stable_sort_primitive = "warn"

# Fires only on 3.14-style float literals in test data (deny by default);
# low value for a runtime that rarely hardcodes math constants.
approx_constant = "allow"
# `assert_eq!(x, false)` reads better than `assert!(!x)` in tests.
bool_assert_comparison = "allow"

[profile.dev]
debug = "line-tables-only"  # cut down on the amount of debug info

[profile.dev.package."*"]
debug = false               # no debug info in third-party crates
