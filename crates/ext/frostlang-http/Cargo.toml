[package]
name = "frostlang-http"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
# See `[[test]]`.
autotests = false

[dependencies]
# `auth.basic`'s credentials. The version reqwest uses.
base64 = "0.23"
frostlang = { path = "../../frostlang", version = "0.0.1", default-features = false }
frostlang-tokio.workspace = true
# The stream a body file is sent from. The version reqwest uses.
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
# To tell, among reqwest's errors, a connection failing from other causes,
# and to check a URL converts for sending as reqwest will. The version reqwest
# uses.
hyper = "1.6"
# Without the defaults, to choose the TLS backend: `rustls`, verifying against
# the operating system's trust store. `system-proxy` reads macOS and Windows
# proxy settings, beyond the environment's; `stream` streams a file as a body.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "system-proxy",
    "gzip",
    "brotli",
    "zstd",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
# `save_to`'s file, written in place and renamed on success.
tempfile = "3.27"
# `fs` for streaming files to and from the network. The version reqwest uses.
tokio = { version = "1.54", features = ["fs", "io-util"] }
url = "2.5"

# Where reqwest's verifier reads the system's trust store from the system's
# files, to tell when they hold no certificate. The version it uses.
[target.'cfg(all(unix, not(target_os = "android"), not(target_vendor = "apple"), not(target_arch = "wasm32")))'.dependencies]
rustls-native-certs = "0.8.5"

[dev-dependencies]
# Compressed response bodies, made from readable text.
brotli = "9.1"
flate2 = "1.1"
zstd = "0.14"
# The tests compile Frost source.
frostlang.workspace = true
# An HTTP/2 test server, over TLS, on a runtime of its own.
h2 = "0.4"
http = "1.3"
tokio = { version = "1.54", features = ["net", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
# A certificate authority and server certificates, for an HTTPS test server.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
# The HTTPS test server, with the crypto provider reqwest uses.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# A port held bound but not listening, for a connection to be refused.
socket2 = "0.6"
# Scratch directories for `save_to` and `body_file`.
tempfile = "3.27"

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
