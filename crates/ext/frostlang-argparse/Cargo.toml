[package]
name = "frostlang-argparse"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
# See `[[test]]`.
autotests = false

[dependencies]
# Without `color`: help and errors are plain text, for the script to place.
# `string` takes the spec's names and text as owned Strings.
clap = { version = "4.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "string",
] }
frostlang = { path = "../../frostlang", version = "0.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Seeded, so the generated specs of `tests/generated_specs.rs` are the same
# every run.
fastrand = "2.5"
# The tests compile Frost source.
frostlang.workspace = true

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
