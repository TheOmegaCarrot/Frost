[package]
name = "frostlang-uuid"
version = "0.0.1"
edition.workspace = true
# See `[[test]]`.
autotests = false

[dependencies]
frostlang = { workspace = true, default-features = false }
# `std` for its monotonic `Generator`.
ulid = "3"
uuid = { version = "1.28", features = ["v4", "v7"] }

[dev-dependencies]
# The tests compile Frost source.
frostlang.workspace = true

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
