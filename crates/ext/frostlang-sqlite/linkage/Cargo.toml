[package]
name = "frostlang-sqlite-linkage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Reports which SQLite `frostlang-sqlite` linked; driven by `check-linkage.sh`."
publish = false

[dependencies]
frostlang.workspace = true
# Without `bundled`, so the script chooses the linkage mode.
frostlang-sqlite = { path = ".." }
# Only for `rusqlite-bundled`.
rusqlite = { workspace = true, optional = true }

[features]
bundled = ["frostlang-sqlite/bundled"]
# Bundles SQLite through `rusqlite`'s own feature, as a host depending on
# `rusqlite` directly may, leaving `frostlang-sqlite`'s off.
rusqlite-bundled = ["dep:rusqlite", "rusqlite/bundled"]

[lints]
workspace = true
