[package]
name = "frost-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
enumset = { version = "1.1", features = ["serde"] }
# `std.random`'s generator. No default features: seeding is our own (see `stdlib::random`).
fastrand = { version = "2.5", default-features = false, features = ["alloc"] }
ryu = "1"
serde = { version = "1", features = ["derive", "rc"] }
itertools = "0.15"
# `std.regex`: small, dependency-free, from the maintainers of `regex`.
regex-lite = "0.1"
strsim = "0.11.1"

[dev-dependencies]
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
# Lets integration tests start from Frost source. Usable only from `tests/`: a
# unit test would link a second copy of this crate, whose types would not match.
frost-compile = { path = "../frost-compile" }

[lints]
workspace = true
