[package]
name = "frostlang-repl"
version = "0.0.1"
edition.workspace = true
# See `[[test]]`.
autotests = false

[features]
default = ["line-editor"]
# A terminal input with line editing, history, and highlighting.
line-editor = ["dep:reedline", "dep:nu-ansi-term", "dep:dirs", "dep:fastrand", "dep:ctrlc"]
# Draw compile errors as source snippets with their labels rather than
# narrating them as plain text.
graphical-diagnostics = ["frostlang/graphical-diagnostics"]

[dependencies]
# Ctrl-C cancelling a running input, on every platform.
ctrlc = { version = "3.5", optional = true }
# Where the platform keeps history.
dirs = { version = "7", optional = true }
# Unpredictable names for the external editor's directory.
fastrand = { version = "2.5", optional = true }
frostlang.workspace = true
frostlang-parse.workspace = true
# The version reedline uses, for the styles its highlighter takes.
nu-ansi-term = { version = "0.50", optional = true }
reedline = { version = "0.52", optional = true }

[dev-dependencies]
# The tests assert on the graphical rendering.
frostlang-repl = { path = ".", features = ["graphical-diagnostics"] }

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
