[package]
name = "frostlang-astviz"
version = "0.0.1"
edition.workspace = true
# Development tooling, not part of Frost.
publish = false

[dependencies]
frostlang-parse.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[lints]
workspace = true
