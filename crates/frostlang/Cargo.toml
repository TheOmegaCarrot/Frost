[package]
name = "frostlang"
version = "0.0.1"
edition.workspace = true

[features]
default = ["compile"]
# Compiling Frost source: the `compile` module.
compile = ["dep:frostlang-parse", "dep:miette"]
# Graphical rendering of a compile `Diagnostic`: each source snippet drawn with
# its labels, and the fixed `render_*` styles.
graphical-diagnostics = [
    "compile",
    "miette/fancy-no-backtrace",
    "frostlang-parse/graphical-diagnostics",
]
# Saving compiled programs to bytes and loading them back: the `image` module.
image = ["dep:postcard"]

[dependencies]
enumset = { version = "1.1", features = ["serde"] }
# `std.random`'s generator. No default features: seeding is our own (see `stdlib::random`).
fastrand = { version = "2.5", default-features = false, features = ["alloc"] }
frostlang-parse = { workspace = true, optional = true }
# `std.fs`'s glob patterns: matching only; `fs.glob` walks the filesystem itself.
# Dependency-free, from the Rust project.
glob = "0.3"
itertools = "0.15"
miette = { version = "7", default-features = false, optional = true }
# `image`'s encoding.
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
# `std.regex`: small, dependency-free, from the maintainers of `regex`.
regex-lite = "0.1"
ryu = "1"
serde = { version = "1", features = ["derive", "rc"] }
strsim = "0.11.1"

[dev-dependencies]
# The tests cover every feature, and assert on the graphical rendering.
frostlang = { path = ".", features = ["graphical-diagnostics", "image"] }
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

[lints]
workspace = true
