[package]
name = "frostlang"
version = "0.0.1"
edition.workspace = true

[features]
default = ["compile"]
# Compiling Frost source.
compile = ["dep:frostlang-compile"]
# Draw compile errors as source snippets with their labels.
graphical-diagnostics = ["compile", "frostlang-compile/graphical-diagnostics"]

[dependencies]
frostlang-compile = { workspace = true, optional = true }
frostlang-runtime.workspace = true

[lints]
workspace = true
