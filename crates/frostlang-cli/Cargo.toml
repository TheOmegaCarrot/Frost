[package]
name = "frostlang-cli"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
# See `[[test]]`.
autotests = false

[[bin]]
name = "frost"
path = "src/main.rs"

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
frostlang-driver = { workspace = true, features = ["graphical-diagnostics"] }
frostlang-fs-resolver = { workspace = true, features = ["graphical-diagnostics"] }
frostlang.workspace = true
# Every format.
frostlang-formats = { workspace = true, features = ["json", "msgpack", "toml"] }
frostlang-uuid.workspace = true
# Bundled, so `frost` needs no SQLite installed.
frostlang-sqlite = { workspace = true, features = ["bundled"] }

[lints]
workspace = true
