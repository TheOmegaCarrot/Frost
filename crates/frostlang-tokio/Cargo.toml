[package]
name = "frostlang-tokio"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
# See `[[test]]`.
autotests = false

[dependencies]
frostlang = { path = "../frostlang", version = "0.0.1", default-features = false }
# `std` for `catch_unwind`.
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "net"] }

[dev-dependencies]
# The tests compile Frost source.
frostlang.workspace = true
# The tests run Vms inside a host's own Tokio runtime.
tokio = { version = "1.54", features = ["rt-multi-thread", "rt", "time", "sync"] }

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
