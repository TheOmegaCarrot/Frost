[package]
name = "frostlang-parse"
version = "0.0.1"
edition.workspace = true
# See `[[test]]`.
autotests = false

[features]
# Graphical rendering of a `ParseError`: the source snippet drawn with its
# labels, and the fixed `render_*` styles.
graphical-diagnostics = ["miette/fancy-no-backtrace"]

[dependencies]
logos = "0.15"
miette = { version = "7", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The tests assert on the graphical rendering.
frostlang-parse = { path = ".", features = ["graphical-diagnostics"] }

# One binary for every integration test, rather than one per file, to save the
# build time and disk of linking each separately. Each file in `tests/` is a
# module of `tests/main.rs`, which must declare it.
[[test]]
name = "integration"
path = "tests/main.rs"

[lints]
workspace = true
