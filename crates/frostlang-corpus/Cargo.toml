[package]
name = "frostlang-corpus"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The core-language test corpus for Frost, and its runner"
publish = false

# The library's tests are the `runner` target's.
[lib]
test = false
doctest = false

[dependencies]
frostlang.workspace = true
# Runs a script's option sets in parallel.
rayon = "1.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The corpus test's harness: one trial per script, run in parallel and
# filtered like the built-in harness.
libtest-mimic = "0.8"

# The corpus itself, run by its own harness rather than libtest's.
[[test]]
name = "corpus"
path = "tests/corpus.rs"
harness = false

# The runner's own tests, against fixtures outside the corpus.
[[test]]
name = "runner"
path = "tests/runner.rs"

[lints]
workspace = true
