[package]
name = "frostlang-corpus"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The core-language test corpus for Frost, and its runner"
publish = false

# The library's tests are the `runner` target's, and its benchmarks the
# `corpus` bench target's. Left benchable, the library would run under
# libtest's bench harness too, which rejects criterion's options.
[lib]
test = false
doctest = false
bench = false

[dependencies]
frostlang.workspace = true
# Runs a script's option sets in parallel.
rayon = "1.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The corpus test's harness: one trial per script, run in parallel and
# filtered like the built-in harness.
libtest-mimic = "0.8"
# The benchmarks' harness: statistics, and baselines for comparing revisions.
# Without its default features, which add plotting and HTML reports.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# The corpus itself, run by its own harness rather than libtest's.
[[test]]
name = "corpus"
path = "tests/corpus.rs"
harness = false

# The runner's own tests, against fixtures outside the corpus.
[[test]]
name = "runner"
path = "tests/runner.rs"

# The corpus's benchmarks, timed by criterion: `cargo bench -p frostlang-corpus`.
[[bench]]
name = "corpus"
path = "benches/corpus.rs"
harness = false

[lints]
workspace = true
