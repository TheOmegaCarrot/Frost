[package]
name = "frost-repl"
version.workspace = true
edition.workspace = true

[features]
default = ["line-editor"]
# A terminal input with line editing, history, and highlighting.
line-editor = ["dep:reedline", "dep:nu-ansi-term", "dep:frost-parse"]

[dependencies]
frost-compile = { path = "../frost-compile" }
frost-parse = { path = "../frost-parse", optional = true }
frost-runtime = { path = "../frost-runtime" }
# The version reedline uses, for the styles its highlighter takes.
nu-ansi-term = { version = "0.50", optional = true }
reedline = { version = "0.52", optional = true }

[lints]
workspace = true
